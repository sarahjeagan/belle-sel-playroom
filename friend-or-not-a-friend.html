function lesson(){let [title,body,q,scene]=LESSON[state.lesson];let obj={t:title,scene,answer:/Red|Bullying/.test(title)?'not':'friend'};app.innerHTML=`<div class="pill">Mini lesson • ${state.lesson+1} of ${LESSON.length}</div><div class="card">${visual(obj)}<h1>${esc(title)}</h1><p>${esc(body)}</p><div class="feedback"><strong>💬 Let's talk!</strong><p>${esc(q)}</p></div><div class="buttons"><button class="btn soft" onclick="state.lesson=Math.max(0,state.lesson-1);lesson()">⬅ Back</button><button class="btn blue" onclick="${state.lesson===LESSON.length-1?'settings()':'state.lesson++;lesson()'}">${state.lesson===LESSON.length-1?'🎮 Play Game':'Next ➡'}</button></div></div>`}
function settings(){state.stage='settings';app.innerHTML=`<div class="card"><h1>🎮 Choose Your Game</h1><div class="buttons"><button class="btn green" onclick="state.level=1;settings2()">🌱 Learning About Friends</button><button class="btn blue" onclick="state.level=2;settings2()">🕵️ Understanding Bullying</button></div></div>`}
function settings2(){app.innerHTML=`<div class="card"><h1>Choose a learning level</h1><p>All three have the same friend and bullying skills, with different amounts of support.</p><div class="buttons"><button class="btn soft" onclick="state.support='emerging';settings3()">🌼 Emerging<br><span class="small">Short words • picture • tap</span></button><button class="btn soft" onclick="state.support='developing';settings3()">🌿 Developing<br><span class="small">Short sentence • picture • tap</span></button><button class="btn soft" onclick="state.support='expanding';settings3()">🌳 Expanding<br><span class="small">Explain • solve • tap</span></button></div></div>`}
function settings3(){app.innerHTML=`<div class="card"><h1>⏰ Choose session length</h1><p>${state.support} support • ${state.level===1?'Friends':'Bullying'}</p><div class="buttons"><button class="btn blue" onclick="begin(15)">⭐ 15 cards (recommended)</button><button class="btn soft" onclick="begin(20)">20 cards (fast group)</button><button class="btn soft" onclick="begin(30)">30 cards (all)</button></div><p class="small">30 cards per game, shuffled each time.</p></div>`}
function begin(n){let a=DATA.filter(x=>x.level===state.level);for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}state.deck=a.slice(0,n);state.idx=0;state.correct=0;state.attempts=0;render()}
function render(){
 state.answered=false;
 const item=state.deck[state.idx];if(!item){finish();return}
 const options=item.answer==='neutral'?'<button class="btn amber" onclick="answer(\'neutral\')">🟡 LET’S TALK</button>':'';
 app.innerHTML=`<div class="pill">${state.level===1?'🌱 Friendship':'🕵️ Understanding Bullying'} • Card ${state.idx+1} of ${state.deck.length}</div>
 <div class="progress"><div style="width:${100*state.idx/state.deck.length}%"></div></div>
 <div class="card">${visual(item)}
 <div class="scenario">${esc(item.t)}</div>
 <p style="text-align:center" class="muted">👆 Is this a friend choice or a not-a-friend choice?</p>
 <div class="buttons"><button class="btn green" onclick="answer('friend')">💚 FRIEND</button>
 <button class="btn red" onclick="answer('not')">❤️ NOT A FRIEND</button>${options}</div>
 <div id="feedback"></div></div>`;
}
function answer(a){if(state.answered)return;let item=state.deck[state.idx],ok=a===item.answer;state.attempts++;if(ok)state.correct++;state.answered=true;let f=document.getElementById('feedback');f.innerHTML=`<div class="feedback"><strong>${ok?'⭐ You got it!':'💡 Let’s learn together!'}</strong><p>${esc(item.why)}</p>${item.bully?'<div class="bully-alert"><strong>🚨 BULLY ALERT! 🚨</strong><p>This may be bullying: hurtful behavior that keeps happening and involves a power difference. Tell a trusted adult!</p></div>':''}<p><b>💬 Talk about it:</b> ${esc(state.support==='emerging'?'Kind or hurtful? Show me.':state.support==='developing'?item.q:'Why? What could someone do next? '+item.q)}</p><div class="buttons"><button class="btn blue" onclick="state.idx++;render()">Next ➡</button></div></div>`;f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function finish(){app.innerHTML=`<div class="card" style="text-align:center"><h1>🎉 Great teamwork!</h1><p>You talked about ${state.deck.length} situations.</p><p>Keep practicing kind choices and asking trusted adults for help.</p><p class="small">Adult note: ${state.correct} first selections matched the intended answer out of ${state.attempts} completed cards. These are practice responses, not a formal assessment.</p><div class="buttons"><button class="btn blue" onclick="settings()">Play Again</button><button class="btn soft" onclick="startLesson()">Mini Lesson</button></div></div>`}
function guide(){app.innerHTML=`<div class="card"><h1>📋 Adult Guide</h1><h2>20-minute flow</h2><p>0–5 min: Mini lesson. 5–17 min: About 15 scenario cards (adjust pace as needed). 17–20 min: Discuss one strategy and practice asking a trusted adult for help.</p><h2>Developmental supports</h2><p>Emerging: show the image, read one short line, model the choice, accept pointing or gestures. Developing: ask “kind or hurtful?” and “how do they feel?” Expanding: ask about repetition, power, repair, and safe next steps.</p><h2>CASEL alignment</h2><p>Social awareness: notice feelings and perspectives. Relationship skills: inclusion, communication, boundaries, and help-seeking. Responsible decision-making: identify safe, caring choices. Self-awareness and self-management: notice feelings and choose responses.</p><h2>Illinois SEL alignment</h2><p>Use this activity to support Illinois SEL goals related to recognizing emotions, demonstrating interpersonal skills, and responsible decision-making. Check the current ISBE grade-band benchmarks before using exact codes in IEP documentation; this game is an instructional resource, not a validated assessment.</p><h2>Bullying note</h2><p>Bullying involves unwanted aggressive behavior, a real or perceived power imbalance, and repetition or a likelihood of repetition. A single incident may still be serious and require adult help. Do not label children as bullies based only on these cards.</p><h2>Visuals and privacy</h2><p>Illustrations are simple, self-contained cartoon scenes with text and symbolic cues; they are not custom hand-drawn depictions of every action. No student names or responses are uploaded. An adult reads each scenario aloud.</p><button class="btn blue" onclick="home()">Home</button></div>`}
home();</script></body></html>
