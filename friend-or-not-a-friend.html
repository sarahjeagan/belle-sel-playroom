function home(){speechSynthesis?.cancel();state.stage='home';app.innerHTML=`<div class="card" style="text-align:center"><h1>💚 Friend or Not a Friend? ❤️</h1><p>Learn about kind choices, hurtful choices, and bullying.</p><div class="buttons"><button class="btn blue" onclick="startLesson()">📚 Start Mini Lesson</button><button class="btn soft" onclick="settings()">🎮 Skip to Game</button></div></div><div class="card"><h2>👩‍🏫 For grown-ups</h2><p class="small">A 5-minute mini lesson plus a 10–15 minute game fits a typical 20-minute session. Read-aloud is available on every card. Use the explanation after each choice for discussion. “Not a Friend” labels the <b>behavior</b>, not the child.</p><button class="btn soft" onclick="guide()">📋 Standards &amp; facilitation guide</button></div>`}

function render(){state.answered=false;let item=state.deck[state.idx];if(!item){finish();return}let drag=state.support!=='emerging' && state.idx%3===1;let nuanced=item.answer==='neutral';let options=nuanced?`<button class="btn amber" onclick="answer('neutral')">🟡 LET'S TALK</button>`:'';app.innerHTML=`<div class="pill">${state.level===1?'🌱 Level 1':'🕵️ Level 2'} • Card ${state.idx+1} of ${state.deck.length}</div><div class="progress"><div style="width:${100*state.idx/state.deck.length}%"></div></div><div class="card">${visual(item)}<div class="scenario">${esc(state.support==='emerging'?item.t.split(/[,.]/)[0]+'.':item.t)}</div><div class="buttons" style="margin-top:14px"><button class="btn soft" onclick="say(${JSON.stringify(item.t)})">🔊 Read to me</button></div><p style="text-align:center">${drag?'✋ Drag the picture choice or tap a button.':'👆 Tap your answer.'}</p><div class="buttons"><button class="btn green" draggable="${drag}" ondragstart="event.dataTransfer.setData('text/plain','friend')" onclick="answer('friend')">💚 FRIEND</button><button class="btn red" draggable="${drag}" ondragstart="event.dataTransfer.setData('text/plain','not')" onclick="answer('not')">❤️ NOT A FRIEND</button>${options}</div>${drag?'<p class="small muted" style="text-align:center">You can also drag a button into the matching box below.</p><div class="choices"><div class="drop green" ondragover="event.preventDefault()" ondrop="event.preventDefault();answer(event.dataTransfer.getData(\'text/plain\'))">💚 FRIEND</div><div class="drop red" ondragover="event.preventDefault()" ondrop="event.preventDefault();answer(event.dataTransfer.getData(\'text/plain\'))">❤️ NOT A FRIEND</div></div>':''}<div id="feedback"></div></div>`}
function answer(a){if(state.answered)return;let item=state.deck[state.idx],ok=a===item.answer;state.attempts++;if(ok)state.correct++;state.answered=true;let f=document.getElementById('feedback');f.innerHTML=`<div class="feedback"><strong>${ok?'⭐ You got it!':'💡 Let’s learn together!'}</strong><p>${esc(item.why)}</p>${item.bully?'<p><b>🚨 This could be bullying.</b> When hurtful behavior repeats (or is likely to repeat) and there is a power difference, tell a trusted adult.</p>':''}<p><b>💬 Talk about it:</b> ${esc(state.support==='emerging'?'Kind or hurtful? Show me.':state.support==='developing'?item.q:'Why? What could someone do next? '+item.q)}</p><div class="buttons"><button class="btn soft" onclick="say(${JSON.stringify(item.why+' '+item.q)})">🔊 Listen</button><button class="btn blue" onclick="state.idx++;render()">Next ➡</button></div></div>`;f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function finish(){app.innerHTML=`<div class="card" style="text-align:center"><h1>🎉 Great teamwork!</h1><p>You talked about ${state.deck.length} situations.</p><p>Keep practicing kind choices and asking trusted adults for help.</p><p class="small">Adult note: ${state.correct} first selections matched the intended answer out of ${state.attempts} completed cards. These are practice responses, not a formal assessment.</p><div class="buttons"><button class="btn blue" onclick="settings()">Play Again</button><button class="btn soft" onclick="startLesson()">Mini Lesson</button></div></div>`}
function guide(){app.innerHTML=`<div class="card"><h1>📋 Adult Guide</h1><h2>20-minute flow</h2><p>0–5 min: Mini lesson. 5–17 min: About 15 scenario cards (adjust pace as needed). 17–20 min: Discuss one strategy and practice asking a trusted adult for help.</p><h2>Developmental supports</h2><p>Emerging: show the image, read one short line, model the choice, accept pointing or gestures. Developing: ask “kind or hurtful?” and “how do they feel?” Expanding: ask about repetition, power, repair, and safe next steps.</p><h2>CASEL alignment</h2><p>Social awareness: notice feelings and perspectives. Relationship skills: inclusion, communication, boundaries, and help-seeking. Responsible decision-making: identify safe, caring choices. Self-awareness and self-management: notice feelings and choose responses.</p><h2>Illinois SEL alignment</h2><p>Use this activity to support Illinois SEL goals related to recognizing emotions, demonstrating interpersonal skills, and responsible decision-making. Check the current ISBE grade-band benchmarks before using exact codes in IEP documentation; this game is an instructional resource, not a validated assessment.</p><h2>Bullying note</h2><p>Bullying involves unwanted aggressive behavior, a real or perceived power imbalance, and repetition or a likelihood of repetition. A single incident may still be serious and require adult help. Do not label children as bullies based only on these cards.</p><h2>Visuals and privacy</h2><p>Illustrations are simple, self-contained cartoon scenes with text and symbolic cues; they are not custom hand-drawn depictions of every action. No student names or responses are uploaded. Read-aloud uses the device's built-in speech feature when available.</p><button class="btn blue" onclick="home()">Home</button></div>`}
home();</script></body></html>
